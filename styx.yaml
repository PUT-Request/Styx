# Styx self-audit configuration
prompt: |
  Audit the Styx codebase for:
  - Security vulnerabilities (hardcoded secrets, insecure defaults)
  - Go best practices (error handling, race conditions, resource leaks)
  - API compatibility issues
  - Code quality and maintainability
  
  Check all Go files in internal/ and cmd/ directories.
  For each issue found:
  - Use `git checkout -b styx/fix-<issue-name>` to create a feature branch
  - Fix the issue in the code
  - Use `git add .` and `git commit -m "fix: <description>"` to commit
  - Use `git push origin styx/fix-<issue-name>` to push the branch
  - Verify the branch exists on GitHub using `gh api repos/PUT-Request/Styx/branches/styx/fix-<issue-name>`
  - If push fails, report the error and DO NOT continue to the next fix
  - Switch back to master with `git checkout master`
  
  When done, print a summary of all branches created and fixes applied.

mode: read_write

api_endpoint: ${STYX_API_ENDPOINT}
api_key: ${STYX_API_KEY}
model: nemotron-3.5-lightning-free
max_context: 256000

max_working_time: 20m
